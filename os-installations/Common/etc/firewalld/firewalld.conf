# firewalld configuration. Only values that differ from the defaults; every
# option, with its default, is documented in firewalld.conf(5).
## https://man.archlinux.org/man/firewalld.conf.5
## https://github.com/firewalld/firewalld/blob/main/config/firewalld.conf

# Log dropped and rejected unicast packets (journalctl -k), to see what the
# firewall blocks. Broadcast and multicast are left out: they're mostly noise.
LogDenied=unicast

# Ports published by containers (Docker, Podman) stay closed until firewalld
# allows them explicitly, instead of being opened behind its back.
StrictForwardPorts=yes
