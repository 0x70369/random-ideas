# ~/.config/topgrade.toml

[misc]
# Topgrade itself is updated by yay, like any other package
no_self_update = true

# Ask for the sudo password at the start, not in the middle of the run
pre_sudo = true

# Only send a desktop notification at the end if something failed
notify_end = "on_failure"


[linux]
# Use yay explicitly instead of autodetecting
arch_package_manager = "yay"

# Show Arch Linux news before updating (it announces manual interventions)
show_arch_news = true


[pkgfile]
# Keep the pkgfile database up to date (used by the command-not-found hook)
enable = true


[firmware]
# Offer to install firmware updates instead of only listing them
upgrade = true


[flatpak]
# Use sudo for the system-wide installation (avoids a polkit dialog)
use_sudo = true


# Commands to run after all built-in steps (the numbers keep the order):
# remove unused Flatpak runtimes
[post_commands]
"1. Flatpak user" = "flatpak uninstall --user --unused --noninteractive"
"2. Flatpak system" = """\
    sudo flatpak uninstall --system --unused --noninteractive"""
