# All settings: alacritty(5) and https://alacritty.org/config-alacritty.html

####################################################################

[cursor]
blink_interval = 500 # Milliseconds
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Never"

####################################################################

# Make sure the font you want to use is installed.
[font]
size = 12.0

# Bold, italic and bold italic use the same family, with the matching style
[font.normal]
family = "JetBrainsMono Nerd Font"

####################################################################

[general]
import = [ "~/.config/alacritty/themes/dracula.toml" ]

####################################################################

[scrolling]
history = 2666

####################################################################

[window]
opacity = 0.69

decorations = "Full"
decorations_theme_variant = "Dark"

dynamic_title = true

[window.dimensions]
lines = 32
columns = 96
