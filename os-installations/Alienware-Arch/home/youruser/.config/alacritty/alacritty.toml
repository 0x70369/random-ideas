# Extra settings can be found here: https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd
# And here: https://alacritty.org/config-alacritty.html

####################################################################

[cursor]
blink_interval = 0 # Milliseconds
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Always"

####################################################################

# Make sure the font you want to use is installed.
[font]
size = 12.0

# Bold, italic and bold italic use the same family with the matching style by default
[font.normal]
family = "JetBrains Mono Nerd Font"

####################################################################

[general]
import = [ "~/.config/alacritty/themes/dracula.toml" ]

####################################################################

[scrolling]
history = 2666

####################################################################

[window]
opacity = 0.69

#padding.x = 10
#padding.y = 10

decorations = "Full"
decorations_theme_variant = "Dark"

dynamic_title = true

[window.dimensions]
lines = 32
columns = 96
