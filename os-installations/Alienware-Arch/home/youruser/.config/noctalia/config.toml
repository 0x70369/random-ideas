# Noctalia (v5) configuration
#
# Changes apply when the file is saved. Validate edits with
# `noctalia config validate`.
#
# Settings changed in the GUI are written to
# ~/.local/state/noctalia/settings.toml, which is loaded after this file and
# wins. If a value here seems ignored, look there.
#
# Complete reference: https://docs.noctalia.dev/noctalia/
# Companion compositor config: ~/.config/umbriel/config.toml

# ==============================================================================
# Shell
# https://docs.noctalia.dev/noctalia/configuration/

[shell]
font_family = "JetBrainsMono Nerd Font"
# Without Plasma there is no polkit agent; Noctalia provides one.
polkit_agent = true
# Already the default; kept explicit for privacy.
telemetry_enabled = false
# Umbriel overview integration: type to search apps, close it after launching.
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

# Same idea as the compositor's shadow: no offset (ML4W look).
[shell.shadow]
alpha = 0.4
direction = "center"

# Every panel floats (the launcher and clipboard already do by default), with
# translucent, blurred backgrounds (blur comes from the Umbriel layer rule).
[shell.panel]
control_center_placement = "floating"
transparency_mode = "glass"
wallpaper_placement = "floating"

[osd]
position = "bottom_center"

# ==============================================================================
# Battery
# https://docs.noctalia.dev/noctalia/services/battery/
#
# Built-in low-battery alerts, for the combined charge of the laptop's
# batteries. Each one shows once; charging above its level re-arms it.
#   1. warning_threshold: "Battery low", normal notification.
#   2. 5% (fixed): critical notification.
#   3. 2% (fixed): persistent critical notification, the computer will shut
#      down soon; stays on screen until charged or dismissed.
# They stay visible in Do Not Disturb, muted. 0 disables all three.

[battery]
warning_threshold = 30

# ==============================================================================
# Theme
# https://docs.noctalia.dev/noctalia/theming/
#
# Dracula matches the palette of the Umbriel config. For the full ML4W behaviour
# (colors taken from the wallpaper), use: source = "wallpaper". The compositor's
# border colors don't follow it by themselves.

[theme]
builtin = "Dracula"

# ==============================================================================
# Bar
# https://docs.noctalia.dev/noctalia/bar/
#
# ML4W look: a floating, rounded, translucent and blurred top bar, with each
# widget in its own capsule.

[bar.default]
enabled = true
position = "top"
layer = "top"
reserve_space = true

thickness = 36
margin_edge = 8        # > 0 floats the bar; close to the compositor's 10 px gap
margin_ends = 10
concave_edge_corners = false
radius = 12

background_opacity = 0.55
compositor_blur = true # Needs the Umbriel layer rule for ^noctalia-bar-.
border = "outline_variant"
border_width = 0.0
shadow = true

padding = 10
widget_spacing = 6
hover_highlight = true
show_tooltip = true

capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.85
capsule_thickness = 0.76

start = ["launcher", "workspaces", "active_window"]
center = ["clock"]
end = [
  "media",
  "tray",
  "keyboard_layout",
  "volume",
  "notifications",
  "control-center",
  "session",
]

# The laptop's own panel also gets the laptop-only widgets. `match` is a
# connector name or part of the monitor description.
[bar.default.monitor.laptop]
match = "eDP-1"
end = [
  "media",
  "tray",
  "keyboard_layout",
  "cpu",
  "ram",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "power_profile",
  "notifications",
  "control-center",
  "session",
]

# ==============================================================================
# Widgets
# https://docs.noctalia.dev/noctalia/bar/widgets/
#
# A name in the bar lists that has no [widget.<name>] entry is used as the
# widget type with its defaults. Middle-click a widget to open its settings.

[widget.clock]
format = "{:%Y/%m/%d - %A - %H:%M}"

[widget.keyboard_layout]
display = "short" # BR, GB, FR

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_used"

# Glyph only; the value shows on hover.
[widget.bluetooth]
peek = true

[widget.brightness]
peek = true

[widget.network]
peek = true

[widget.volume]
device = "output"
show_label = true

[widget.volume.actions]
middle = "volume-mute"

# ==============================================================================
# Wallpaper
# https://docs.noctalia.dev/noctalia/desktop/wallpaper/
#
# Wallpapers come from the XDG Pictures folder.

[wallpaper]
transition = ["fade", "wipe", "disc"]
transition_duration = 1000

# ==============================================================================
# Idle
# https://docs.noctalia.dev/noctalia/services/idle/
#
# Lock, then turn the displays off. Suspend stays with systemd-logind (lid,
# power key). Video players and games inhibit idle themselves.

[idle]
behavior_order = ["lock", "screen-off"]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
locked_timeout = 60 # Already locked: displays off after 1 minute.
timeout = 660

# ==============================================================================
# Night light
# https://docs.noctalia.dev/noctalia/services/
#
# Warmer screen from 17:00 to 08:00. The schedule lives in [location], which
# also feeds the weather and the theme's automatic mode.

[nightlight]
enabled = true
temperature_night = 5200

[location]
custom_schedule = true
sunset = "17:00"
sunrise = "08:00"
