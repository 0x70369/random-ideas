# linux-tkg external configuration for the Alienware m16 R1.
#
# tkg sources its own customization.cfg first and this file over it, so only
# the values that differ from customization.cfg are here; every option is
# documented there.
# https://github.com/Frogging-Family/linux-tkg/blob/master/customization.cfg

_distro="Arch"

# Build in RAM (/tmp is a tmpfs); modprobed-db keeps the build small enough
_kernel_work_folder="/tmp/kernel-build"

_noccache="true"

# Only the modules in ~/.local/share/modprobed-db/modprobed.db (the default
# path), plus the fixed fragment alienware.myfrag
_modprobeddb="true"

# Open menuconfig before building and save the changes as a diff (the name
# must not end in .myfrag, or tkg would apply it as a fragment)
_menunconfig="1"
_diffconfig="true"
_diffconfig_name="menuconfig-diff.txt"

_cpusched="bore"
_compiler="gcc"

# Tickless idle only
_tickless="2"
_acs_override="false"

# -O3, tuned for this CPU
_compileroptlevel="2"
_processor_opt="native"

_timer_freq="1000"

# Kernel defaults: schedutil governor, no extra command line
_default_cpu_gov=""
_custom_commandline=""

_custom_pkgbase="linux-tkg"
_NR_CPUS_value="$(nproc --all)"
