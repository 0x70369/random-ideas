# Umbriel configuration. Only values that differ from Umbriel's defaults are
# set here. Validate edits with `umbriel config validate`; list every key with
# its default with `umbriel config schema`.
# Reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Animations
# https://docs.noctalia.dev/umbriel/animation/
#
# Approximation of ML4W's default Hyprland animation profile: same curves and
# feel, not a 1:1 copy (the two compositors have different primitives).
# https://github.com/mylinuxforwork/dotfiles/blob/main/dotfiles/.config/hypr/conf/animations/default.lua

[animation]
duration_ms = 200
curve = "md3_decel"

[animation.beziers]
linear = [0.0, 0.0, 1.0, 1.0]
md3_accel = [0.3, 0.0, 0.8, 0.15]
md3_decel = [0.05, 0.7, 0.1, 1.0]
menu_decel = [0.1, 1.0, 0.0, 1.0]

[animation.border]
duration_ms = 100
curve = "linear"

[animation.layers]
enabled = true
curve = "menu_decel"

[animation.overview]
duration_ms = 250
workspace_curve = "menu_decel"

[animation.windows_drag]
physics = true

[animation.windows_in]
scale = 0.60

[animation.windows_out]
duration_ms = 160
curve = "md3_accel"
scale = 0.60

[animation.workspaces]
duration_ms = 300
curve = "menu_decel"

# ==============================================================================
# Appearance
# https://docs.noctalia.dev/umbriel/appearance/
#
# ML4W geometry (3 px border, 10 px rounding and gaps, strong blur, wide soft
# shadow without offset) with the Dracula palette: https://draculatheme.com/spec

[appearance]
border_width = 3

[appearance.blur]
passes = 4
radius = 3

[appearance.shadow]
offset_x = 0
offset_y = 0
softness = 30

[appearance.tab_bar]
font = "JetBrainsMono Nerd Font 10"
height = 32
max_tabs = 6

[colors]
accent_primary = "#BD93F9FF"
accent_secondary = "#8BE9FDFF"
backdrop = "#282A36FF"
background = "#282A36FF"
error = "#FF5555FF"
insert_hint = "#50FA7B80"
shadow = "#00000066"
text_muted = "#6272A4FF"
text_primary = "#F8F8F2FF"
warning = "#FFB86CFF"

[colors.border]
focused = "#BD93F9FF"
outer = "#21222CFF"
unfocused = "#44475AFF"

[colors.overview]
background_tint = "#282A36B0"
badge = "#FF79C6FF"
workspace_background = "#44475A66"

[colors.tab_bar]
active = "#BD93F9FF"
active_text = "#282A36FF"
active_unfocused = "#44475AFF"
active_unfocused_text = "#F8F8F2FF"
background = "#21222CFF"
text = "#6272A4FF"
urgent = "#FF5555FF"
urgent_text = "#F8F8F2FF"

# ==============================================================================
# Events and general
# https://docs.noctalia.dev/umbriel/configuration/

[events]
lid_close = "umbriel msg output-disable eDP-1"
lid_open = "umbriel msg output-enable eDP-1"

[general]
autostart = ["noctalia"]
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
xwayland_native_resolution = true

# ==============================================================================
# Input
# https://docs.noctalia.dev/umbriel/input/

[input]
# Mod+right-click twice maximizes, as a double click on a title bar does.
mod_right_double_click = "maximize"
# While dragging a window, a right click makes a tiled window float or a
# floating one tile when it is dropped.
window_drag_toggle = "floating"

[input.cursor]
size = 32
theme = "Bibata Modern Ice"

[input.keyboard]
layout = "br"
model = "abnt2"
numlock_toggle = true
options = "terminate:ctrl_alt_bksp"
repeat_delay = 300
repeat_rate = 60

[input.touchpad]
accel_profile = "adaptive"
click_method = "clickfinger"
disable_while_typing = true
natural_scroll = true
scroll_factor = 1.5
sensitivity = 0.5

# ==============================================================================
# Keybinds
# https://docs.noctalia.dev/umbriel/keybinds/
# https://docs.noctalia.dev/umbriel/actions/
#
# Defining [keybinds] replaces Umbriel's built-in set. Within each group,
# bindings are sorted by modifier count, then alphabetically.

[keybinds]

# Applications
"Mod+E" = { action = "spawn xdg-open \"$HOME\"", repeat = false }
"Mod+Return" = { action = "spawn alacritty", repeat = false }
"Mod+Shift+E" = { action = "spawn alacritty -e yazi", repeat = false }

# Focus and movement
"Mod+Down" = "window-focus-down"
"Mod+F1" = "window-focus-next"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+WheelDown" = "window-focus-right"
"Mod+WheelUp" = "window-focus-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+WheelDown" = "column-move-right"
"Mod+Shift+WheelUp" = "column-move-left"

# Floating (stacking) layout. Mod+Shift+F switches the workspace between
# floating and tiling; the others only act on floating windows.
"Mod+N" = { action = "window-minimize", repeat = false }
"Mod+Ctrl+C" = { action = "window-center", repeat = false }
"Mod+Ctrl+Down" = { action = "window-set-region bottom", repeat = false }
"Mod+Ctrl+Left" = { action = "window-set-region left", repeat = false }
"Mod+Ctrl+N" = { action = "window-restore-minimized", repeat = false }
"Mod+Ctrl+Right" = { action = "window-set-region right", repeat = false }
"Mod+Ctrl+Up" = { action = "window-clear-region", repeat = false }
"Mod+Shift+F" = { action = "workspace-set-layout toggle stacking scrolling", repeat = false }

# Scratchpad
"Mod+Space" = "scratchpad-toggle"
"Mod+Tab" = "scratchpad-focus-next"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }

# Session and shell
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+S" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+N" = { action = "spawn noctalia msg notification-dnd-toggle", repeat = false }

# Special keys: Alienware m16 R1 / br-abnt2. Fn+F1 is performance mode,
# Fn+F[2-6] are macro keys, Fn+F8 sends Super+P and Fn+F9 sends Super+A.
# Fn+F7 and Fn+F12 are handled by the firmware/driver. Power and sleep keys
# stay with systemd-logind.
"Pause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false } # Fn+End
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false } # Fn+Home
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true, repeat = true }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn noctalia msg media pause", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true, repeat = true }
"XF86AudioStop" = { action = "spawn noctalia msg media stop", allow_when_locked = true, repeat = false }
"XF86Macro1" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false } # Fn+F2
"XF86Macro2" = { action = "overview-toggle", repeat = false } # Fn+F3
"XF86Macro3" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false } # Fn+F4
"XF86Macro4" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false } # Fn+F5
"XF86Macro5" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false } # Fn+F6
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true, repeat = true } # Fn+F10
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true, repeat = true } # Fn+F11
"XF86PerformanceMode" = { action = "spawn noctalia msg power-cycle", repeat = false } # Fn+F1
"Alt+Print" = { action = "spawn noctalia msg screenshot-fullscreen all", repeat = false } # Fn+Alt+Home
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false } # Fn+Ctrl+Home
"Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false } # Fn+Shift+Home
"Super+A" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false } # Fn+F9
"Super+P" = { action = "spawn alacritty --hold -e umbriel outputs", repeat = false } # Fn+F8

# Window state and layout
"Mod+C" = "column-center"
"Mod+Comma" = "window-consume-left"
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Period" = "window-consume-right"
"Mod+R" = "window-cycle-primary-extent"
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Shift+O" = { action = "workspace-set-layout toggle", repeat = false }
"Mod+Shift+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+PageDown" = "workspace-next"
"Mod+PageUp" = "workspace-previous"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/

[[layer_rule]]
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
blur_popups = true
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"

# ==============================================================================
# Layout
# https://docs.noctalia.dev/umbriel/layout/
#
# Tiling ("scrolling") by default; Mod+Shift+F turns a workspace into
# traditional floating windows ("stacking"), with title bars (see the window
# rules), edge snapping and Mod+Ctrl+arrows.

[layout]
extent_presets = [0.333, 0.5, 0.667]
gap = 10

[layout.scrolling]
center_focused = "on_overflow"
default_extent_fraction = 0.5

[layout.tabs]
middle_click_closes = true
new_tab_position = "after_active"

# ==============================================================================
# Outputs
# https://docs.noctalia.dev/umbriel/outputs/
#
# Matched by monitor identity, so settings follow the display between ports;
# `umbriel outputs` shows the exact names. Detachable displays have no
# position, so Umbriel places them automatically.

# Built-in 16-inch AUO panel.
[output."AU Optronics 0x3ca2 Unknown"]
bit_depth = 10
cyclic_workspaces = true
focus_at_startup = true
hdr = "auto"
mode = "2560x1600@60.012"
position = [0, 0]
scale = 1.25
vrr = "always"
workspaces = 9

[output."LG Electronics LG TV SSCR2 0x01010101"]
cyclic_workspaces = true
hdr = "auto"
mode = "3840x2160@60"
scale = 2.0
workspaces = 9

[output."Samsung Electric Company SAMSUNG 0x01000601"]
cyclic_workspaces = true
mode = "1920x1080@60"
workspaces = 9

[output."Toshiba America Info Systems Inc 0x9428 0x616d0000"]
cyclic_workspaces = true
hdr = "auto"
mode = "3840x2160@60"
scale = 2.7
vrr = "fullscreen"
workspaces = 9

# ==============================================================================
# Hot corners
# https://docs.noctalia.dev/umbriel/workspaces-overview/

[hot_corners.top_left]
action = "overview-open"
enabled = true

# ==============================================================================
# Window rules
# https://docs.noctalia.dev/umbriel/window-rules/
#
# Rules combine in order; later matching values override earlier ones. Inspect
# real IDs with `umbriel windows`.

# Global blur.
[[window_rule]]
blur = true
blur_optimized = false

# ML4W look: unfocused windows are slightly translucent; video and games stay
# opaque (fullscreen windows already are).
[[window_rule]]
match.is_focused = false
opacity = 0.9

[[window_rule]]
match.content_type = "video"
opacity = 1.0

[[window_rule]]
match.content_type = "game"
opacity = 1.0

[[window_rule]]
match.app_id = ["^mpv$", "^org[.]videolan[.]VLC$", "^vlc$"]
opacity = 1.0

# Floating layout: title bars with buttons. "on" lets apps that draw their own
# header bar keep it, so nothing gets two bars.
[[window_rule]]
match.layout = "stacking"
title_bar = "on"
title_bar_buttons = ["minimize", "maximize", "close"]

# Workspace 9 for unmatched tiled applications; the rules below override it.
[[window_rule]]
match.is_floating = false
default_workspace = 9

# Workspace 1: browsers (Helium, Brave Origin, LibreWolf, Tor Browser).
[[window_rule]]
match.app_id = [
  "^helium-browser$",
  "^Helium$",
  "^brave-origin",
  "^librewolf$",
  "^io[.]gitlab[.]librewolf-community$",
  "^tor-browser$",
  "^Tor Browser$",
  "^org[.]torproject[.]torbrowser-launcher$",
]
default_workspace = 1

# Workspace 2: file managers.
[[window_rule]]
match.app_id = ["^dolphin$", "^org[.]kde[.]dolphin$"]
default_workspace = 2

# Workspace 3: multimedia.
[[window_rule]]
match.app_id = [
  "^mpv$",
  "^org[.]kde[.]gwenview$",
  "^Gwenview$",
  "^org[.]musicbrainz[.]Picard$",
  "^org[.]videolan[.]VLC$",
  "^vlc$",
]
default_workspace = 3

# Workspace 4: communication.
[[window_rule]]
match.app_id = [
  "^com[.]rtosta[.]zapzap$",
  "^dev[.]vencord[.]Vesktop$",
  "^org[.]telegram[.]desktop$",
  "^TelegramDesktop$",
  "^vesktop$",
  "^ZapZap$",
]
default_workspace = 4

# Workspace 5: programming.
[[window_rule]]
match.app_id = ["^codium$", "^com[.]vscodium[.]codium$", "^VSCodium$"]
default_workspace = 5

# Workspace 6: office, documents and scanning.
[[window_rule]]
match.app_id = [
  "^onlyoffice-desktopeditors$",
  "^org[.]onlyoffice[.]desktopeditors$",
  "^org[.]kde[.]okular$",
  "^Okular$",
  "^org[.]kde[.]skanpage$",
  "^Skanpage$",
]
default_workspace = 6

# Workspace 7: games and game launchers.
[[window_rule]]
match.app_id = ["^com[.]valvesoftware[.]Steam$", "^steam$", "^steam_app_[0-9]+$"]
default_workspace = 7

[[window_rule]]
match.content_type = "game"
default_workspace = 7

# Keep the pointer inside Steam games.
[[window_rule]]
match.app_id = "^steam_app_[0-9]+$"
confine_pointer = true

# Workspace 8: information and settings.
[[window_rule]]
match.app_id = [
  "^com[.]github[.]tchx84[.]Flatseal$",
  "^com[.]vysp3r[.]ProtonPlus$",
  "^io[.]missioncenter[.]MissionCenter$",
  "^missioncenter$",
]
default_workspace = 8

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }
default_workspace = 8

# Umbriel's screencast picker stays where it was invoked.
[[window_rule]]
match.app_id = "^dev[.]noctalia[.]UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_focused = false
default_pinned = true
default_position = { x = 0, y = 0, anchor = "bottom_right" }

# Dracula scratchpad accent.
[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#FFB86CFF"
border_color_unfocused = "#6272A4FF"
