# Defining XDG directories according to: https://specifications.freedesktop.org/basedir-spec/latest/#variables
## https://wiki.archlinux.org/title/XDG_Base_Directory

XDG_CONFIG_HOME="${HOME}/.config"
XDG_CACHE_HOME="${HOME}/.cache"
XDG_DATA_HOME="${HOME}/.local/share"
XDG_STATE_HOME="${HOME}/.local/state"

# XDG_DATA_DIRS and XDG_CONFIG_DIRS are left to their defaults (/usr/local/share:/usr/share and
# /etc/xdg). Flatpak adds its export directories to XDG_DATA_DIRS by itself: through
# /etc/profile.d/flatpak.sh in login shells, and through its systemd user environment generator
# (60-flatpak) in the graphical session.
