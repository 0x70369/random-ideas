COMPRESSION="zstd"
# See zstd(1) for details. With MODULES_DECOMPRESS, the modules and firmware are compressed together
# with the rest of the image, so a high level shrinks the UKI. zstd decompresses at about the same
# speed at any level, so the boot isn't slower; only building the image takes a few seconds more.
# mkinitcpio already adds -T0 (all cores) for zstd.
COMPRESSION_OPTIONS=(-19 --long -v)
MODULES_DECOMPRESS="yes"
