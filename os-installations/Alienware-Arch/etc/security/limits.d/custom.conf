## https://wiki.archlinux.org/title/Limits.conf
# Only what differs from the defaults. Left out on purpose:
#   - core: a soft limit of 0 makes systemd-coredump log crashes without keeping the dump, so
#     coredumpctl has nothing to debug;
#   - nofile: systemd already gives 1024 soft / 524288 hard, and programs that need more (Proton's
#     esync, for example) raise their soft limit up to the hard one; a hard limit of 32767 was lower;
#   - nproc: it counts threads, not processes, so a browser plus Steam and a game can reach a few
#     thousand; fork bombs are already contained by systemd (TasksMax of the user slice).

#<domain>      <type>  <item>         <value>
*               hard    nice           -8     # Regular users may raise priority down to nice -8, not further.

## https://wiki.linuxaudio.org/wiki/system_configuration#limits.conf/audio.conf
## https://wiki.archlinux.org/title/Realtime_process_management#Configuring_PAM
@audio          -       rtprio         98          # maximum realtime priority
@audio          -       memlock        unlimited   # maximum locked-in-memory address space (KB)
@audio          hard    nice           -16
