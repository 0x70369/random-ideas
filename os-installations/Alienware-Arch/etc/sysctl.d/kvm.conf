## https://wiki.archlinux.org/title/PCI_passthrough_via_OVMF#Dynamic_huge_pages

# The VM's hugepages are created on demand: the libvirt hook compact-memory.sh adds them to the
# pool before the VM starts, and these overcommit pages are a fallback.
vm.nr_hugepages = 0
vm.nr_overcommit_hugepages = 8192

# Compact memory in the background, more than by default (20), so more free 2 MiB blocks are ready
# when the VM starts. Costs a little CPU every now and then.
## https://docs.kernel.org/admin-guide/sysctl/vm.html#compaction-proactiveness
vm.compaction_proactiveness = 90
