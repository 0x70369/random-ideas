# All Magic SysRq functions on the keyboard (Alt+PrtSc+key), e.g. REISUB to reboot safely after a freeze.
# systemd's 50-default.conf allows only sync (16); this file is read after it and wins.
# Anyone at the keyboard can kill processes or reboot, even with the screen locked (the lock itself holds:
# killing KWin ends the session).
## https://docs.kernel.org/admin-guide/sysrq.html
kernel.sysrq = 1
