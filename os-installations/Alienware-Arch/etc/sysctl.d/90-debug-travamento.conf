# TEMPORARY, while the 2026-11-10 freeze is investigated: turn lockups into a panic, which pstore records,
# and reboot 10 s later. Needs kernel.nmi_watchdog=1 in the battery tuned profiles too. Delete afterwards.
## https://docs.kernel.org/admin-guide/lockup-watchdogs.html
kernel.hardlockup_panic=1
kernel.softlockup_panic=1
kernel.panic=10
