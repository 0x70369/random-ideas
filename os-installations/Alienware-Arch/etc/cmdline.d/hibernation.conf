# Resume from hibernation into the swapfile (/.swap/swapfile, in the Arch/@swap subvolume).
# lz4 decompresses faster than the default lzo. Redundant on the linux-tkg kernel, where lz4 is the
# Kconfig default (HIBERNATION_COMP_LZ4 in alienware.myfrag), but needed on linux and linux-zen.
hibernate.compressor=lz4
