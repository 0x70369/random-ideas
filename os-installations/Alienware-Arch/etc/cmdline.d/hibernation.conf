# No resume= here: systemd finds the hibernation image by itself. When hibernating, it writes the
# swapfile's device and offset (computed for btrfs too) to the EFI variable HibernateLocation; in the
# initramfs, systemd-hibernate-resume-generator reads it and resumes from there after sd-encrypt
# unlocks the root. Nothing to update when the swapfile is recreated.
## https://wiki.archlinux.org/title/Power_management/Suspend_and_hibernate#Hibernation_into_swap_file
# lz4 decompresses faster than the default lzo. Redundant on the linux-tkg kernel, where lz4 is the
# Kconfig default (HIBERNATION_COMP_LZ4 in alienware.myfrag), but needed on linux and linux-zen.
hibernate.compressor=lz4
