# Unlock the LUKS partition in the initramfs and map it as /dev/mapper/root.
# The UUID is the LUKS partition's, which changes on every reinstall: lsblk -o NAME,UUID,FSTYPE | grep crypto_LUKS
## https://wiki.archlinux.org/title/Dm-crypt/System_configuration#Using_systemd-cryptsetup-generator
rd.luks.name=UUID_DA_PARTICAO_LUKS=root rd.luks.options=password-echo=no,tries=2,timeout=60s
