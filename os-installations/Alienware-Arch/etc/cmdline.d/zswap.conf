# Compressed cache in RAM for pages on their way to swap.
# zstd compresses more than lz4, which matters with the VM and the kernel build in tmpfs.
## https://docs.kernel.org/admin-guide/mm/zswap.html
zswap.enabled=1 zswap.shrinker_enabled=1 zswap.compressor=zstd zswap.max_pool_percent=23 zswap.accept_threshold_percent=90
