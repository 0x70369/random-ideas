## https://man.archlinux.org/man/sleep.conf.d.5#OPTIONS
[Sleep]
# Hibernation powers off through the firmware.
## https://wiki.archlinux.org/title/Power_management/Suspend_and_hibernate#System_does_not_power_off_when_hibernating
HibernateMode=platform
# Suspend to RAM (S3) instead of s2idle.
## https://nwildner.com/posts/2024-06-05-dell-laptop-suspend/
MemorySleepMode=deep
SuspendState=mem
