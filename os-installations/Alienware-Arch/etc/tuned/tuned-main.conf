# TuneD's global configuration. Only values that differ from the defaults
# (tuned/consts.py); see tuned-main.conf(5).
## https://man.archlinux.org/man/tuned-main.conf.5
## https://github.com/redhat-performance/tuned/blob/master/tuned/consts.py

# No alienware-* profile uses dynamic tuning; with it on, the daemon
# re-evaluates the load every update_interval (wasted wakeups on battery).
dynamic_tuning = 0

# Without dynamic tuning the daemon only wakes up to poll (default: every
# 1 s), which a Python 3 interpreter doesn't need; fewer wakeups on battery.
sleep_interval = 10
