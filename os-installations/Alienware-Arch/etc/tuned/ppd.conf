[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=alienware-battery
balanced=alienware-balanced
performance=alienware-performance

[battery]
# PPD = TuneD. Only "balanced" changes on battery: power-saver is already battery-oriented,
# and performance keeps its AC limits if chosen on purpose.
balanced=alienware-balanced-battery
