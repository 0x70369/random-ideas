# /etc/tuned/ppd.conf: power-profiles-daemon (PPD) profiles -> TuneD profiles
# https://github.com/redhat-performance/tuned/blob/master/tuned/ppd/ppd.conf
#
# tuned-ppd keeps the selected PPD profile and swaps the TuneD profile behind
# it when the charger is connected or removed ([profiles] on AC, [battery] on
# battery). The default, performance, therefore gives alienware-performance
# on AC and alienware-battery on battery, with no hook.
# Apply changes: systemctl restart tuned-ppd.service

[main]
# The default PPD profile
default=performance
# Follow AC/battery through UPower.
battery_detection=true
# The alienware-* profiles write platform_profile themselves; don't let
# tuned-ppd read those writes back as a profile change made by the firmware.
sysfs_acpi_monitor=false

[profiles]
# On AC. PPD = TuneD
power-saver=alienware-battery
balanced=alienware-balanced
performance=alienware-performance

[battery]
# On battery. Every PPD profile is listed, so none is left without a mapping.
power-saver=alienware-battery
balanced=alienware-balanced-battery
performance=alienware-balanced-battery
