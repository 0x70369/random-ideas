##
# Profile: alienware-balanced -- the everyday default, used on AC *and* battery.
# Every setting here must be defensible without knowing the power source.
# Plugins: https://tuned-project.org/docs/manual.html
#

[main]
summary=General non-specialized tuned profile for Alienware

# REMOVED: [modules] cpufreq_conservative=+r. With intel_pstate in active mode the
# kernel only exposes performance and powersave, so the module had nothing to bind to.
## cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
## cat /sys/devices/system/cpu/intel_pstate/status

[cpu]
# REMOVED: priority=. It orders instances of the same plugin; there is only one here.

# https://docs.kernel.org/admin-guide/pm/cpufreq.html#generic-scaling-governors
governor=powersave
# https://docs.kernel.org/admin-guide/pm/intel_epb.html
energy_perf_bias=normal
# The knob that actually steers P-state selection under HWP.
# https://wiki.archlinux.org/title/CPU_frequency_scaling#Setting_the_EPP
## cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
energy_performance_preference=balance_power

# Turbo stays. Disabling it defeats race-to-idle: tasks run longer, cores stay out
# of C6, and on a 13900HX that often costs more energy than the turbo would have.
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#frequency-boost-support
## cat /sys/devices/system/cpu/cpufreq/policy0/boost
boost=1

[acpi]
# https://docs.kernel.org/userspace-api/sysfs-platform_profile.html
## cat /sys/firmware/acpi/platform_profile_choices
platform_profile=balanced

[audio]
# Suspend the HDA codec after 10 s idle. Addresses the largest device in the powertop
# report -- the NVIDIA HDMI codec. 10 s rather than powertop's 1 s: codec resume is
# what produces the audible pop, so a longer window means far fewer of them.
## cat /sys/module/snd_hda_intel/parameters/power_save
# https://wiki.archlinux.org/title/Advanced_Linux_Sound_Architecture#Power_saving
timeout=10

[sysctl]
# --- swap: geometry, not a power trade -- identical in all three profiles --------
# A page in the zswap pool still consumes a swap slot; zswap is a cache in front of
# the swap device, not a replacement. The 16 GB swapfile (32 GB RAM) doubles as the
# hibernation target via resume_offset=, so those slots are the hibernation budget.
# https://docs.kernel.org/admin-guide/mm/zswap.html
# https://docs.kernel.org/admin-guide/sysctl/vm.html#swappiness
vm.swappiness=60

# Readahead of 8 pages per fault is wasted when the page returns from the compressed
# pool in RAM. 1 hedges for pages zswap rejects as poorly compressible.
## sudo grep -H . /sys/kernel/debug/zswap/{stored_pages,written_back_pages,reject_compress_poor}
# https://docs.kernel.org/admin-guide/sysctl/vm.html#page-cluster
vm.page-cluster=1

# --- kernel defaults, restated so a cold boot into this profile is also correct ---
# Default 5 s writeback; powersave's 1500 is a battery-only trade and this profile
# also runs on AC.
vm.dirty_writeback_centisecs=500

# Hard lockup detection on: a lockup leaving nothing in the logs is not worth the
# NMI savings in the everyday profile.
# https://docs.kernel.org/admin-guide/sysctl/kernel.html#nmi-watchdog
kernel.nmi_watchdog=1

[sysfs]
# Runtime PM for PCI devices. The wildcard covers devices that appear later or move
# address, unlike a hand-maintained list of BDFs.
#
# FIRST THING TO REVERT if anything gets strange: USB controllers dropping devices,
# card readers vanishing, odd NVMe wake latency.
# https://docs.kernel.org/power/pci.html
## grep . /sys/bus/pci/devices/*/power/control
/sys/bus/pci/devices/*/power/control=auto

# ASPM middle ground: enables the link states the hardware advertises, without
# powersupersave's aggressive L1 substates or performance's blanket disable.
# Silently ignored if firmware never handed control to the OS -- confirm with:
## sudo lspci -vv | grep -i 'ASPM.*Enabled'
# https://docs.kernel.org/admin-guide/kernel-parameters.html
/sys/module/pcie_aspm/parameters/policy=powersave
