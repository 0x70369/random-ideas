#
# Profile: alienware-powersave -- battery only.
# Runtime is the sole objective; responsiveness, latency and
# throughput are all currency to spend on it.
# Plugins: https://tuned-project.org/docs/manual.html
#

[main]
summary=Optimize for low power consumption on Alienware

[cpu]
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#generic-scaling-governors
governor=powersave
# https://docs.kernel.org/admin-guide/pm/intel_epb.html
energy_perf_bias=power
# The knob that actually steers P-state selection under HWP.
# https://wiki.archlinux.org/title/CPU_frequency_scaling#Setting_the_EPP
energy_performance_preference=power

# No turbo. Defeats race-to-idle -- a bad trade on AC -- but the top of a 13900HX
# V/f curve is brutally inefficient and avoiding it wins more here. Still the one
# setting most worth measuring rather than assuming:
## sudo turbostat --quiet --show PkgWatt,Busy%,Bzy_MHz,CPU%c6 sleep 60
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#frequency-boost-support
boost=0

# Cap the P-state on top of that; no_turbo limits the ceiling to max non-turbo and
# this takes a percentage of what remains, so the two compound. 40% is aggressive:
# fine for browsing, editors and video, visibly slow for anything heavier. Raise it
# if compositor stutter appears.
# https://docs.kernel.org/admin-guide/pm/intel_pstate.html
## cat /sys/devices/system/cpu/intel_pstate/max_perf_pct
## grep MHz /proc/cpuinfo | sort -u
max_perf_pct=40

[acpi]
# https://docs.kernel.org/userspace-api/sysfs-platform_profile.html
## cat /sys/firmware/acpi/platform_profile_choices
platform_profile=quiet

[audio]
# 1 s, what powertop asks for. Expect the codec-resume pop far more often -- that is
# the trade this profile exists to make. Also covers the NVIDIA HDMI codec, the top
# device in the powertop report by a wide margin.
## cat /sys/module/snd_hda_intel/parameters/power_save
# https://wiki.archlinux.org/title/Advanced_Linux_Sound_Architecture#Power_saving
timeout=1

[usb]
# Replaces the enable_usb_autosuspend call that sat in script.sh behind an undefined
# $USB_AUTOSUSPEND (so it never ran). The plugin also reverts on profile switch.
# Known cost: the Logitech receivers and DELL keyboard may drop the first keystroke
# after idle. Accepted here and nowhere else.
## grep . /sys/bus/usb/devices/*/power/control
# https://docs.kernel.org/driver-api/usb/power-management.html
autosuspend=1

[sysctl]
# --- writeback -------------------------------------------------------------------
# https://docs.kernel.org/admin-guide/laptops/laptop-mode.html
vm.laptop_mode=5

# Batch writeback into infrequent bursts so the NVMe gets long stretches of real
# idle instead of a wakeup every 5 s.
# https://docs.kernel.org/admin-guide/sysctl/vm.html#dirty-writeback-centisecs
vm.dirty_writeback_centisecs=1500

# Same idea from the other side: let dirty pages age far longer before becoming
# eligible, so each burst carries more. Costs up to a minute of writes on a crash.
# https://docs.kernel.org/admin-guide/sysctl/vm.html#dirty-expire-centisecs
vm.dirty_expire_centisecs=6000

# --- swap: geometry, not a power trade -- identical in all three profiles --------
# A page in the zswap pool still consumes a swap slot; the 16 GB swapfile (32 GB RAM)
# doubles as the hibernation target via resume_offset=, which matters most here since
# hibernating is a battery action.
# https://docs.kernel.org/admin-guide/mm/zswap.html
# https://docs.kernel.org/admin-guide/sysctl/vm.html#swappiness
vm.swappiness=60
vm.page-cluster=1

# --- watchdog --------------------------------------------------------------------
# Off: a periodic NMI on all 32 threads is exactly the kind of unavoidable wakeup
# that keeps the package out of deep C-states. The trade is real -- a hard lockup on
# battery leaves nothing in the logs. Both AC profiles turn it back on.
# https://docs.kernel.org/admin-guide/sysctl/kernel.html#nmi-watchdog
kernel.nmi_watchdog=0

[sysfs]
# Runtime PM for every PCI device; the wildcard needs no maintenance when devices
# appear later or change address.
# https://docs.kernel.org/power/pci.html
## grep . /sys/bus/pci/devices/*/power/control
/sys/bus/pci/devices/*/power/control=auto

# ASPM at its most aggressive, enabling the L1 substates balanced leaves alone. One
# of the largest levers for package C-state residency with Thunderbolt and two NVMe.
# Silently ignored if firmware never handed control to the OS -- confirm with:
## sudo lspci -vv | grep -i 'ASPM.*Enabled'
# https://docs.kernel.org/admin-guide/kernel-parameters.html
/sys/module/pcie_aspm/parameters/policy=powersupersave

# Disarm network devices as system wakeup sources -- powertop reports the CNVi Wi-Fi
# as wakeup-enabled, holding it high to watch for traffic nobody sends to a laptop on
# battery. This is the ACPI/PCI arming, complementary to ethtool WoL in [net] below.
# The wildcard matches only hardware-backed interfaces; virtual ones have no device/.
## grep . /sys/class/net/*/device/power/wakeup
# https://docs.kernel.org/power/pci.html#pci-device-power-management
/sys/class/net/*/device/power/wakeup=disabled

[net]
# Wake-on-LAN off: it keeps the Killer E3000 PHY powered watching for magic packets.
# Value passes through to ethtool, so "d" is disabled. Scoped to the wired interface
# because aiming ethtool WoL at the Wi-Fi device only produces log failures.
## sudo ethtool enp110s0 | grep -i wake
# https://wiki.archlinux.org/title/Wake-on-LAN
devices=enp110s0
wake_on_lan=d

[script]
# The only setting no plugin can express: 802.11 power save has no sysfs interface,
# it goes over nl80211 -- which is why tuned's helper shells out to `iw`. The [net]
# plugin only wraps ethtool. `options iwlmvm power_scheme=3` was rejected because
# module parameters load with the driver and would apply on AC too.
#
# script.sh sources /usr/lib/tuned/functions; stop() sets power save off rather than
# restoring the prior state. If NetworkManager's wifi.powersave is set globally, it
# wins on the next reconnect regardless.
## iw dev wlp0s20f3 get power_save
# https://wiki.archlinux.org/title/Power_management#Network_interfaces
script=${i:PROFILE_DIR}/script.bash
