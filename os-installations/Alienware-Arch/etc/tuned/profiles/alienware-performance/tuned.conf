#
# Profile: alienware-performance -- AC only.
# Plugins: https://tuned-project.org/docs/manual.html
#

[main]
summary=Optimize for deterministic performance at the cost of increased power consumption on Alienware

[cpu]
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#generic-scaling-governors
## cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
governor=performance
# https://docs.kernel.org/admin-guide/pm/intel_epb.html
energy_perf_bias=performance
# The knob that actually steers P-state selection under HWP.
# https://wiki.archlinux.org/title/CPU_frequency_scaling#Setting_the_EPP
## cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
energy_performance_preference=performance

# Accepts only 0/1, no '|' fallback. On Intel, tuned mirrors this into no_turbo --
# so never set both here, they fight over the same file.
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#frequency-boost-support
## cat /sys/devices/system/cpu/cpufreq/policy0/boost
boost=1

# DISABLED ON PURPOSE. force_latency writes a PM QoS ceiling to /dev/cpu_dma_latency,
# capping cpuidle depth. The upstream latency-performance value (cstate.id_no_zero:1|3)
# resolves to C1_ACPI's 1 us here, which forbids C6 (127 us) and C10 (1048 us) on all
# 32 threads -- a server knob that burns thermal headroom the active cores want for
# boost. cstate.id_no_zero:2 would allow C6 and block only C10.
# https://docs.kernel.org/power/pm_qos_interface.html
# https://docs.kernel.org/admin-guide/pm/cpuidle.html
## for d in /sys/devices/system/cpu/cpu0/cpuidle/state*/; do printf '%s\t%s us\n' "$(cat $d/name)" "$(cat $d/latency)"; done
#force_latency=cstate.id_no_zero:2

# DISABLED ON PURPOSE. Pins the P-state floor to max non-turbo, so the CPU never
# clocks down even at idle. HWP + EPP=performance already ramps instantly, so this
# only buys idle heat and fan noise.
# https://docs.kernel.org/admin-guide/pm/intel_pstate.html
#min_perf_pct=100

[acpi]
# "performance" == AWCC Overdrive: fans pinned at max. Not worth the ears.
# https://docs.kernel.org/userspace-api/sysfs-platform_profile.html
## cat /sys/firmware/acpi/platform_profile_choices
platform_profile=balanced-performance

[audio]
# No codec power management on AC -- the battery profiles' idle timeout makes the
# HDA codec resume on every playback start, which some codecs announce with a pop.
# Stated explicitly so the value is deterministic rather than save/restore driven.
## cat /sys/module/snd_hda_intel/parameters/power_save
# https://wiki.archlinux.org/title/Advanced_Linux_Sound_Architecture#Power_saving
timeout=0

[vm]
# From upstream latency-performance: throttle the dirty-data producer earlier
# (default 20%) and start background writeback earlier (default 10%).
# https://docs.kernel.org/admin-guide/sysctl/vm.html#dirty-bytes
dirty_bytes=10%
dirty_background_bytes=3%

[sysctl]
# --- swap: geometry, not a power trade -- identical in all three profiles --------
# A page in the zswap pool still consumes a swap slot; zswap is a cache in front of
# the swap device, not a replacement. The 16 GB swapfile (32 GB RAM) doubles as the
# hibernation target via resume_offset=, so those slots are the hibernation budget.
# 60 keeps the margin.
# https://docs.kernel.org/admin-guide/mm/zswap.html
# https://docs.kernel.org/admin-guide/sysctl/vm.html#swappiness
vm.swappiness=60

# Readahead of 8 pages per fault is wasted when the page returns from the compressed
# pool in RAM. 1 hedges for pages zswap rejects as poorly compressible.
## sudo grep -H . /sys/kernel/debug/zswap/{stored_pages,written_back_pages,reject_compress_poor}
# https://docs.kernel.org/admin-guide/sysctl/vm.html#page-cluster
vm.page-cluster=1

# --- kernel defaults, restated so a cold boot into this profile is also correct ---
# Default 5 s writeback; powersave stretches it to 1500, a battery-only trade that
# would work against dirty_bytes above.
vm.dirty_writeback_centisecs=500

# Hard lockup detection on: the NMI wakeups cost nothing that matters on AC.
# https://docs.kernel.org/admin-guide/sysctl/kernel.html#nmi-watchdog
kernel.nmi_watchdog=1

[sysfs]
# ASPM off on AC. Silently ignored if firmware never handed control to the OS, so
# read it back and confirm with:
## sudo lspci -vv | grep -i 'ASPM.*Enabled'
# https://docs.kernel.org/admin-guide/kernel-parameters.html
/sys/module/pcie_aspm/parameters/policy=performance

[video]
# DISABLED: panel_power_savings and radeon_powersave are radeon/amdgpu attributes;
# this machine is Intel iGPU + NVIDIA dGPU, so tuned only logged "no device found".
# https://docs.kernel.org/gpu/amdgpu/display/index.html
#panel_power_savings=0
