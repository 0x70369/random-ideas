#
# Profile: alienware-performance -- AC only.
# Plugins: https://tuned-project.org/docs/manual.html
#

[main]
summary=Optimize for deterministic performance at the cost of increased power consumption on Alienware

[cpu]
# https://docs.kernel.org/admin-guide/pm/cpufreq.html#generic-scaling-governors
## cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
governor=performance

# https://docs.kernel.org/admin-guide/pm/intel_epb.html
energy_perf_bias=performance

# https://wiki.archlinux.org/title/CPU_frequency_scaling#Setting_the_EPP
## cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
energy_performance_preference=performance

# https://docs.kernel.org/admin-guide/pm/cpufreq.html#frequency-boost-support
## cat /sys/devices/system/cpu/cpufreq/policy0/boost
boost=1

[audio]
# No codec power management on AC
## cat /sys/module/snd_hda_intel/parameters/power_save
# https://wiki.archlinux.org/title/Advanced_Linux_Sound_Architecture#Power_saving
timeout=0

[vm]
# https://docs.kernel.org/admin-guide/sysctl/vm.html#dirty-bytes
dirty_bytes=10%
dirty_background_bytes=3%

[sysctl]
# --- swap --------------------------------------------------------------------------
# https://docs.kernel.org/admin-guide/mm/zswap.html
# https://docs.kernel.org/admin-guide/sysctl/vm.html#swappiness
vm.swappiness=60

# Readahead of 8 pages per fault is wasted when the page returns from the compressed
# pool in RAM. 1 hedges for pages zswap rejects as poorly compressible.
## sudo grep -H . /sys/kernel/debug/zswap/{stored_pages,written_back_pages,reject_compress_poor}
# https://docs.kernel.org/admin-guide/sysctl/vm.html#page-cluster
vm.page-cluster=1

# --- kernel defaults ---------------------------------------------------------------
# Default 5 s writeback; powersave stretches it to 1500, a battery-only trade that
# would work against dirty_bytes above.
vm.dirty_writeback_centisecs=500

# https://docs.kernel.org/admin-guide/sysctl/kernel.html#nmi-watchdog
kernel.nmi_watchdog=1

[sysfs]
# https://docs.kernel.org/power/pci.html
## grep . /sys/bus/pci/devices/*/power/control
/sys/bus/pci/devices/*/power/control=auto

## sudo lspci -vv | grep -i 'ASPM.*Enabled'
# https://docs.kernel.org/admin-guide/kernel-parameters.html
/sys/module/pcie_aspm/parameters/policy=performance

[script]
# Applies the Dell platform profile and RAPL limits after the firmware delay.
script=${i:PROFILE_DIR}/script-alienware-performance.bash
