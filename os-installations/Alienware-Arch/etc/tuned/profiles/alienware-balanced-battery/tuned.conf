#
# Profile: alienware-balanced-battery -- what PPD's "balanced" switches to on battery (ppd.conf).
# alienware-balanced, with lower power limits and the cheap battery savings of alienware-battery:
# still responsive, unlike alienware-battery, which only cares about runtime.
# Plugins: https://tuned-project.org/docs/manual.html
#

[main]
summary=Balanced profile biased towards power savings on battery for Alienware
include=alienware-balanced

[cpu]
# https://docs.kernel.org/admin-guide/pm/intel_epb.html
energy_perf_bias=balance-power
# Same EPP as alienware-balanced; the lower RAPL limits do the rest.
## cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference
energy_performance_preference=balance_power

[usb]
## grep . /sys/bus/usb/devices/*/power/control
# https://docs.kernel.org/driver-api/usb/power-management.html
autosuspend=1

[sysctl]
# Writeback in bursts every 15 s instead of every 5 s, so the NVMe idles longer.
# https://docs.kernel.org/admin-guide/sysctl/vm.html#dirty-writeback-centisecs
vm.dirty_writeback_centisecs=1500
# https://docs.kernel.org/admin-guide/sysctl/kernel.html#nmi-watchdog
kernel.nmi_watchdog=1

[sysfs]
# PCIe L1 substates as well (alienware-balanced uses powersave).
# https://docs.kernel.org/admin-guide/kernel-parameters.html
/sys/module/pcie_aspm/parameters/policy=powersupersave
# Network devices disarmed as wakeup sources, as in alienware-battery.
## grep . /sys/class/net/*/device/power/wakeup
/sys/class/net/*/device/power/wakeup=disabled

[net]
# Wake-on-LAN off, as in alienware-battery.
## sudo ethtool enp110s0 | grep -i wake
devices=enp110s0
wake_on_lan=d

[script]
# Replaces alienware-balanced's script instead of running after it.
replace=1
# Dell platform profile, RAPL limits and Wi-Fi power saving (see alienware-common/power-policy.bash).
script=${i:PROFILE_DIR}/script-alienware-balanced-battery.bash
