#!/hint/bash
# shellcheck disable=2034

#
# /etc/makepkg.conf.d/disable-debug.conf
#

## https://bbs.archlinux.org/viewtopic.php?pid=2225606#p2225606
# Also see makepkg.conf(5)
# Append, don't replace: makepkg uses the last occurrence of each option, and replacing the array
# would also drop strip, zipman, purge etc. from the defaults in /etc/makepkg.conf.
OPTIONS+=(!debug)
