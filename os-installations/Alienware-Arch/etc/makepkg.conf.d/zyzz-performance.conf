#!/hint/bash
# shellcheck disable=2034
# /etc/makepkg.conf.d/zyzz-performance.conf (Alienware only)
#
# Performance overrides for packages built on this machine. Read after
# /etc/makepkg.conf and the other drop-ins (alphabetical order, hence "zyzz-").
# Every flag Arch enables by default (hardening, frame pointers, LTO) is kept.
#
# https://wiki.archlinux.org/title/Makepkg#Building_optimized_binaries
# https://man.archlinux.org/man/makepkg.conf.5

#-- Instruction set of this CPU and -O3
#   (-march=native binaries crash with SIGILL on CPUs lacking these features)
for _var in CFLAGS CXXFLAGS; do
  declare -n _f=$_var
  _f=${_f/-march=x86-64 -mtune=generic/-march=native}
  _f=${_f/-O2/-O3}
done
unset -n _f
unset _var

#-- Rust: same idea, appended to the defaults (frame pointers)
RUSTFLAGS+=" -C target-cpu=native"

#-- One compile job per logical CPU (make, and CMake's Makefile generator;
#   ninja and cargo already use every CPU by default)
MAKEFLAGS="--jobs=$(nproc)"

#-- Compress the package with every CPU
COMPRESSZST=(zstd -c -T0 -)