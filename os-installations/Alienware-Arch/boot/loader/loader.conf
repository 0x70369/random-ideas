## https://wiki.archlinux.org/title/Systemd-boot#Loader_configuration
## https://man.archlinux.org/man/loader.conf.5#OPTIONS
# Only values that differ from the defaults

auto-poweroff          yes
auto-reboot            yes
# Boots into "Power Off The System" unless another entry is chosen
default                auto-poweroff
reboot-for-bitlocker   yes
timeout                3
