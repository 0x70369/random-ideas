# resume= and resume_offset= for BIOS boots through GRUB, which have no EFI
# variables for systemd's HibernateLocation. The offset changes whenever the
# swapfile is recreated: btrfs inspect-internal map-swapfile -r /.swap/swapfile
## https://wiki.archlinux.org/title/Power_management/Suspend_and_hibernate#Hibernation_into_swap_file

# lz4 decompresses faster than the default lzo.
resume=/dev/mapper/root resume_offset=OFFSET_DO_SWAPFILE hibernate.compressor=lz4
